version: "3.9"

services:
  # ─────────────────────────────────────────
  #  DATABASES & CACHES
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spaider_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaider}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaider_secret}
      POSTGRES_DB: ${POSTGRES_DB:-spaider}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spaider_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaider"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spaider_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-spaider_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spaider_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: spaider_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Spaider_Admin1!}
      - plugins.security.ssl.http.enabled=false
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - spaider_net

  # ─────────────────────────────────────────
  #  BACKEND API
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaider_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spaider}:${POSTGRES_PASSWORD:-spaider_secret}@postgres:5432/${POSTGRES_DB:-spaider}
      REDIS_URL: redis://:${REDIS_PASSWORD:-spaider_redis}@redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      SECRET_KEY: ${SECRET_KEY:-spaider-super-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - scan_results:/app/scan_results
      - malware_samples:/app/malware_samples
      - pcap_files:/app/pcap_files
    networks:
      - spaider_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker_red:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaider_worker_red
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spaider}:${POSTGRES_PASSWORD:-spaider_secret}@postgres:5432/${POSTGRES_DB:-spaider}
      REDIS_URL: redis://:${REDIS_PASSWORD:-spaider_redis}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - scan_results:/app/scan_results
    networks:
      - spaider_net
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.celery_app worker -Q red_queue -c 4 --loglevel=info

  worker_blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaider_worker_blue
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spaider}:${POSTGRES_PASSWORD:-spaider_secret}@postgres:5432/${POSTGRES_DB:-spaider}
      REDIS_URL: redis://:${REDIS_PASSWORD:-spaider_redis}@redis:6379/0
    volumes:
      - ./backend:/app
      - pcap_files:/app/pcap_files
      - malware_samples:/app/malware_samples
    networks:
      - spaider_net
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.celery_app worker -Q blue_queue -c 4 --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaider_celery_beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spaider}:${POSTGRES_PASSWORD:-spaider_secret}@postgres:5432/${POSTGRES_DB:-spaider}
      REDIS_URL: redis://:${REDIS_PASSWORD:-spaider_redis}@redis:6379/0
    volumes:
      - ./backend:/app
    networks:
      - spaider_net
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaider_flower
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-spaider_redis}@redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - spaider_net
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spaider_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - spaider_net
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}

  nginx:
    image: nginx:1.25-alpine
    container_name: spaider_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - spaider_net
    depends_on:
      - backend
      - frontend

  # ─────────────────────────────────────────
  #  VULNERABLE LAB TARGETS (Authorized)
  # ─────────────────────────────────────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: spaider_lab_juice_shop
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - spaider_net
    environment:
      - NODE_ENV=unsafe

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: spaider_lab_dvwa
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - spaider_net

  webgoat:
    image: webgoat/webgoat:latest
    container_name: spaider_lab_webgoat
    restart: unless-stopped
    ports:
      - "8083:8080"
    networks:
      - spaider_net
    environment:
      - WEBGOAT_PORT=8080

networks:
  spaider_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  scan_results:
  malware_samples:
  pcap_files:
